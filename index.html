<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Merveilles">
<meta name="theme-color" content="#9a5a3b" id="metaTheme">
<title>Boulangerie des Merveilles — Livraisons et températures</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🥖</text></svg>">
<link rel="stylesheet" href="fournil.css?v=9">
<link rel="stylesheet" href="livraisons.css?v=7">
<style>
  /* Coquille commune : bandeau collant + choix du module.
     Un seul module est visible à la fois, selon body[data-module]. */
  #haut { position: sticky; top: 0; z-index: 10; }
  .modules { display: flex; gap: 6px; padding: 6px 10px; background: #efe8da; }
  .modules button {
    flex: 1; padding: 9px 4px; font-size: .95rem; font-weight: bold;
    border: none; border-radius: 10px; background: white; color: var(--brun);
  }
  .modules button.actif[data-module="livraisons"] { background: #8DB600; color: #1A0F08; }
  .modules button.actif[data-module="fournil"] { background: var(--acc); color: white; }
  body[data-module="fournil"] .m-livr,
  body[data-module="livraisons"] .m-fournil { display: none !important; }
</style>
</head>
<body data-module="fournil">
<script>
  // Choix du module le plus tôt possible, pour éviter un clignotement à l'ouverture.
  (function () {
    var m = null;
    try {
      var h = location.hash.replace("#", "");
      if (h === "livraisons" || h === "fournil" || h === "temperatures") m = h === "temperatures" ? "fournil" : h;
      if (!m) m = localStorage.getItem("bdm_module");
      // Appareil qui connaît déjà les températures (Maël) : il reste dessus. Nouvel appareil : livraisons.
      if (!m) m = localStorage.getItem("bdm_fournil_v1") ? "fournil" : "livraisons";
    } catch (e) {}
    document.body.dataset.module = m === "livraisons" ? "livraisons" : "fournil";
  })();
</script>

<div id="haut">
  <nav class="modules" aria-label="Choix du module">
    <button type="button" data-module="livraisons">🥖 Livraisons</button>
    <button type="button" data-module="fournil">🌡️ Températures</button>
  </nav>
  <header class="m-fournil">
    <h1>🌡️ Températures fournil</h1>
    <div class="sous">Boulangerie des Merveilles — Fournil — Suivi HACCP <span id="etatSync" title="Synchronisation">⚪</span></div>
  </header>
  <header class="m-livr h-livr">
    <h1>🥖 Livraisons de pain</h1>
    <div class="sous">Boulangerie des Merveilles · Tende — <span id="l_sync" class="l-sync">⚪</span></div>
  </header>
</div>

<!-- ===================== Module Températures fournil (inchangé) ===================== -->
<main class="m-fournil">
  <section id="vueSaisie">
    <div class="date-bar">
      <button id="jourPrec" aria-label="Jour précédent">‹</button>
      <input type="date" id="dateJour">
      <button id="jourSuiv" aria-label="Jour suivant">›</button>
    </div>
    <div id="bandeauFerme" hidden></div>
    <div class="statut-valide" id="statutValide"></div>
    <div class="bandeau-alerte" id="bandeauAlerte"></div>
    <div id="listeFrigos"></div>
    <div class="zone-action" id="zoneAction" hidden>
      <div class="titre-action">Action corrective <span>— température hors plage</span></div>
      <div class="cases-action" id="casesAction"></div>
      <label for="actionCorrective" class="sous-titre-action">Précisions (facultatif)</label>
      <textarea id="actionCorrective" rows="2" maxlength="300" placeholder="Ex. : recontrôle à 9 h : +3 °C."></textarea>
    </div>
  </section>

  <section id="vueRecap">
    <div class="mois-bar"><select id="selMois"></select></div>
    <button class="btn-pdf-mois" id="btnPdfMois">📄 PDF du mois (registre HACCP)</button>
    <button class="btn-pdf-mois c-btn-gestion" data-cal="gestion">📅 Fermetures et congés</button>
    <div id="listeRecap"></div>
  </section>
</main>

<div class="save-bar m-fournil">
  <button id="btnValider">✓ Valider</button>
  <button id="btnRecap" aria-label="Récap du mois">📊</button>
</div>

<!-- ===================== Module Livraisons de pain ===================== -->
<main class="m-livr" id="modLivr">
  <div class="date-bar">
    <button id="l_prec" aria-label="Jour précédent">‹</button>
    <input type="date" id="l_date" aria-label="Date de livraison">
    <button id="l_suiv" aria-label="Jour suivant">›</button>
    <button id="l_auj" aria-label="Revenir à aujourd'hui" title="Aujourd'hui">🏠</button>
  </div>
  <div class="l-date-txt" id="l_date_txt"></div>
  <div class="l-outils" id="l_outils">
    <button type="button" data-act="historique">🕘 Historique</button>
    <button type="button" data-act="recap">📅 Récap du mois</button>
    <button type="button" data-act="reglages">⚙️ Réglages</button>
  </div>
  <div id="l_ferme" hidden></div>
  <div id="l_cartes"></div>
</main>

<div class="l-barre m-livr">
  <button type="button" class="l-btn l-btn-2" id="l_bon">📄 Bon du jour</button>
  <button type="button" class="l-btn" id="l_enregistrer">✓ Enregistrer</button>
</div>

<div class="l-feuille m-livr" id="l_feuille" hidden>
  <div class="l-feuille-tete">
    <button type="button" id="l_f_retour" aria-label="Fermer">✕</button>
    <h2 id="l_f_titre"></h2>
  </div>
  <div class="l-feuille-corps" id="l_f_corps"></div>
  <div class="l-feuille-pied" id="l_f_pied"></div>
</div>

<div class="l-conf m-livr" id="l_conf" hidden>
  <div class="l-conf-boite" role="alertdialog" aria-labelledby="l_conf_msg">
    <p id="l_conf_msg"></p>
    <div class="l-conf-btns">
      <button type="button" id="l_conf_non">Annuler</button>
      <button type="button" id="l_conf_oui" class="oui">OK</button>
    </div>
  </div>
</div>

<!-- Fermetures et congés (commun aux deux onglets) -->
<div class="l-feuille c-feuille" id="c_feuille" hidden>
  <div class="l-feuille-tete">
    <button type="button" data-cal="fermer" aria-label="Fermer">✕</button>
    <h2>Fermetures et congés</h2>
  </div>
  <div class="l-feuille-corps" id="c_corps"></div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="calendrier.js?v=7"></script>
<script src="fournil.js?v=10"></script>
<script src="livraisons.js?v=7"></script>
<script>
  /* Passage d'un module à l'autre. Le choix est mémorisé sur l'appareil. */
  const COULEUR_MODULE = { fournil: "#9a5a3b", livraisons: "#8DB600" };

  function montrerModule(m) {
    document.body.dataset.module = m;
    document.querySelectorAll(".modules button").forEach((b) => b.classList.toggle("actif", b.dataset.module === m));
    document.getElementById("metaTheme").content = COULEUR_MODULE[m];
    if (m === "livraisons") Livr.afficher();
  }

  document.querySelector(".modules").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-module]");
    if (!b || b.dataset.module === document.body.dataset.module) return;
    try { localStorage.setItem("bdm_module", b.dataset.module); } catch (e) {}
    montrerModule(b.dataset.module);
    window.scrollTo(0, 0);
    if (b.dataset.module === "fournil") pullServeur(); // on rafraîchit les températures en y revenant
  });

  montrerModule(document.body.dataset.module);
</script>
</body>
</html>
